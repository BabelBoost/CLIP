name: Ad Studio tests
on:
  pull_request:
    paths: ['tools/ad-studio/**', '.github/workflows/ad-studio.yml']
  push:
    paths: ['tools/ad-studio/**', '.github/workflows/ad-studio.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r tools/ad-studio/requirements.txt
      - run: python -m unittest discover -s tools/ad-studio/tests -v
