name: AutoClip without API checks
on:
  pull_request:
    paths:
      - 'tools/autoclip-no-api/**'
      - '.github/workflows/autoclip-no-api-ci.yml'
  workflow_dispatch:

jobs:
  offline-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/autoclip-no-api/requirements.txt
      - name: Install local software dependencies
        run: python -m pip install -r tools/autoclip-no-api/requirements.txt
      - name: Python syntax check
        run: python -m py_compile tools/autoclip-no-api/*.py
      - name: Offline unit and real MP4 tests
        working-directory: tools/autoclip-no-api
        env:
          NO_API_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: Package Windows launcher
        run: |
          cd tools/autoclip-no-api
          zip -r ../../BabelBoost-AutoClip-Bez-API-Windows.zip . \
            -x '*.pyc' '*/__pycache__/*' 'exports/*' '.venv/*'
      - name: Publish Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BabelBoost-AutoClip-Bez-API-Windows
          path: BabelBoost-AutoClip-Bez-API-Windows.zip
          retention-days: 90
