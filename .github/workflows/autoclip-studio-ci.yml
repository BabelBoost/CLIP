name: AutoClip Studio tests
on:
  pull_request:
    paths:
      - 'tools/prompt-stock-studio/**'
      - '.github/workflows/autoclip-studio-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/prompt-stock-studio/requirements.txt
      - name: Install requirements
        run: python -m pip install -r tools/prompt-stock-studio/requirements.txt
      - name: Compile
        run: python -m py_compile tools/prompt-stock-studio/studio.py tools/prompt-stock-studio/app.py
      - name: Unit and render smoke tests
        working-directory: tools/prompt-stock-studio
        run: python -m unittest discover -s tests -v
      - name: Package Windows ZIP
        run: |
          cd tools/prompt-stock-studio
          zip -r ../../BabelBoost-AutoClip-Studio-Windows.zip . -x '*.pyc' '*/__pycache__/*' 'exports/*'
      - name: Upload Windows app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BabelBoost-AutoClip-Studio-Windows
          path: BabelBoost-AutoClip-Studio-Windows.zip
          retention-days: 90
