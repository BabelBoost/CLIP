name: Video Downloader Tests

on:
  push:
    paths:
      - "tools/video-downloader/**"
      - ".github/workflows/video-downloader-tests.yml"
  pull_request:
    paths:
      - "tools/video-downloader/**"
      - ".github/workflows/video-downloader-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/video-downloader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m py_compile app.py downloader/*.py

      - name: Run tests
        run: python -m pytest -q
