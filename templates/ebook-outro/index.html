<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babel Boost | Outro Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#080f18;color:#eef1ee;font:15px Arial,sans-serif}main{display:grid;grid-template-columns:360px 1fr;min-height:100vh}aside{padding:32px;background:#111d2b}h1{font-size:26px;margin:0 0 8px}p{color:#aab9c6;line-height:1.5}label{display:block;margin-top:20px;color:#b9c6d0}input,select,button{font:inherit;border-radius:8px;padding:12px;width:100%;margin-top:7px;border:1px solid #354455;background:#182738;color:white}button{cursor:pointer;background:#c9ee8d;color:#14271c;font-weight:bold;border:0}button.secondary{background:#263b4e;color:white}.stage{display:flex;align-items:center;justify-content:center;padding:25px}canvas{height:min(88vh,960px);max-width:100%;width:auto;box-shadow:0 20px 90px #0008}small{color:#aab9c6}#status{min-height:42px}@media(max-width:760px){main{display:flex;flex-direction:column}.stage{order:-1}canvas{height:62vh}}</style><main><aside><h1>Outro Studio</h1><p>Babel Boost · 1080 × 1920<br>Gotowa końcówka reklamy. Działa lokalnie.</p><label>Język<select id="lang"><option value="en">English</option><option value="pl">Polski</option></select></label><label>Nagłówek<input id="headline" maxlength="64" value="Your next great read."></label><label>Dopisek<input id="sub" maxlength="85" value="Practical ebooks. Fresh ideas."></label><label>Wezwanie do działania<input id="cta" maxlength="28" value="EXPLORE THE EBOOKS"></label><label>Adres sklepu<input id="url" maxlength="42" value="BabelBoost.com"></label><label>Okładka ebooka (opcjonalnie)<input id="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="secondary" id="clear">Usuń okładkę</button><button id="png">Pobierz PNG</button><button id="video">Pobierz outro 6 s (WebM)</button><p id="status" role="status"></p><small>Dodaj outro na końcu filmu. Muzykę z klipu wycisz przez ostatnią sekundę. Eksport nie zawiera dźwięku. Plik WebM można przekonwertować do MP4 w edytorze wideo.</small></aside><section class="stage"><canvas id="canvas" width="1080" height="1920" aria-label="Podgląd outro Babel Boost"></canvas></section></main><script>
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');let cover=null,busy=false;
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(s,y,size,color='#f4f3e9',weight=700,max=820){ctx.textAlign='center';ctx.fillStyle=color;do{ctx.font=`${weight} ${size--}px Arial`}while(ctx.measureText(s).width>max&&size>12);ctx.fillText(s,510,y)}
function lines(s,y,size,max,step){ctx.font=`700 ${size}px Arial`;let words=s.split(/\s+/),out=[],line='';for(const word of words){let next=line?line+' '+word:word;if(ctx.measureText(next).width>max&&line){out.push(line);line=word}else line=next}out.push(line);out.slice(0,3).forEach((l,i)=>text(l,y+i*step,size,'#f4f3e9',700,max));return out.length}
function draw(t=2){ctx.globalAlpha=1;let g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#102d38');g.addColorStop(.65,'#0a1927');g.addColorStop(1,'#080f19');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.strokeStyle='#94b8a21a';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(1040,620,310+i*115,520+i*120,.3,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#c9ee8d';ctx.fillRect(102,218,48,6);ctx.textAlign='left';ctx.font='700 31px Arial';ctx.fillText('BABEL BOOST',173,232);ctx.font='400 22px Arial';ctx.fillStyle='#a4b8c4';ctx.fillText('THE EBOOK COLLECTION',102,281);
ctx.save();ctx.globalAlpha=Math.min(1,.2+t*2);ctx.translate(0,Math.max(0,1-t*2)*35);ctx.shadowColor='#0008';ctx.shadowBlur=65;ctx.shadowOffsetY=30;round(302,390,432,575,14,'#dce8cb');ctx.shadowBlur=0;ctx.shadowOffsetY=0;round(286,378,432,575,12,'#1c5356');ctx.save();ctx.beginPath();ctx.roundRect(286,378,432,575,12);ctx.clip();if(cover){ctx.fillStyle='#132b34';ctx.fillRect(286,378,432,575);const sc=Math.min(432/cover.width,575/cover.height);ctx.drawImage(cover,286+(432-cover.width*sc)/2,378+(575-cover.height*sc)/2,cover.width*sc,cover.height*sc)}else{ctx.fillStyle='#c9ee8d';ctx.beginPath();ctx.arc(657,480,175,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#bdd6bc66';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(330,840,80+i*36,0,Math.PI*2);ctx.stroke()}ctx.textAlign='left';ctx.fillStyle='#f3f3e9';ctx.font='700 56px Arial';const pl=$('lang').value==='pl';(pl?['Czytaj.','Odkrywaj.','Korzystaj.']:['Read.','Discover.','Do more.']).forEach((s,i)=>ctx.fillText(s,325,665+i*67));ctx.font='700 19px Arial';ctx.fillText('BABEL BOOST BOOKS',325,901)}ctx.fillStyle='#0002';ctx.fillRect(295,378,14,575);ctx.restore();ctx.restore();
lines($('headline').value,1090,74,816,84);text($('sub').value,1308,32,'#afc2ca',400);round(150,1382,720,104,52,'#c9ee8d');text($('cta').value,1448,30,'#14291f',700,650);text($('url').value,1573,48,'#f4f3e9',700,830);text($('lang').value==='pl'?'ZNAJDŹ SWÓJ KOLEJNY EBOOK':'FIND YOUR NEXT EBOOK',1641,20,'#8da7b3',400);}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
for(const id of ['headline','sub','cta','url'])$(id).oninput=()=>draw();$('lang').onchange=()=>{const pl=$('lang').value==='pl';$('headline').value=pl?'Twój kolejny dobry ebook.':'Your next great read.';$('sub').value=pl?'Praktyczne ebooki. Nowe pomysły.':'Practical ebooks. Fresh ideas.';$('cta').value=pl?'ODKRYJ EBOOKI':'EXPLORE THE EBOOKS';draw()};$('cover').onchange=()=>{let f=$('cover').files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{cover=im;URL.revokeObjectURL(u);draw()};im.onerror=()=>{$('status').textContent='Nie można odczytać obrazu.';URL.revokeObjectURL(u)};im.src=u};$('clear').onclick=()=>{cover=null;$('cover').value='';draw()};$('png').onclick=()=>{draw();cv.toBlob(b=>save(b,'BabelBoost_Outro_1080x1920.png'))};$('video').onclick=async()=>{if(busy)return;if(!window.MediaRecorder||!cv.captureStream){$('status').textContent='Eksport wideo wymaga Chrome lub Edge.';return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime){$('status').textContent='Brak obsługi WebM. Pobierz PNG.';return}busy=true;document.querySelectorAll('input,select,button').forEach(e=>e.disabled=true);$('status').textContent='Trwa eksport. Pozostaw kartę aktywną przez 6 sekund.';let stream=cv.captureStream(30),chunks=[];try{let rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{save(new Blob(chunks,{type:mime}),'BabelBoost_Outro_6s.webm');finish('Gotowe. Dodaj plik na końcu klipu.')};rec.onerror=()=>finish('Eksport nie powiódł się. Spróbuj ponownie.');rec.start();let start=performance.now();function frame(now){draw((now-start)/1000);if(now-start<6000)requestAnimationFrame(frame);else rec.stop()}requestAnimationFrame(frame)}catch(e){finish('Eksport nie powiódł się. Pobierz PNG.')}function finish(s){stream.getTracks().forEach(t=>t.stop());busy=false;document.querySelectorAll('input,select,button').forEach(e=>e.disabled=false);$('status').textContent=s;draw()}};draw();
</script></html>
